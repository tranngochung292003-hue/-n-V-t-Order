<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chi Shop - Đặt hàng online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #facc15;
    }

    .cart-button {
      border: none;
      background: #facc15;
      color: #111827;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      max-width: 1100px;
      margin: 25px auto;
      padding: 35px 20px;
      border-radius: 25px;
      background: linear-gradient(135deg, #fde68a, #fef3c7);
      text-align: center;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
      font-size: 16px;
    }

    /* PRODUCTS */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 15px 50px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 800;
      margin: 25px 0 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      transition: 0.25s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .product-image {
      width: 100%;
      height: 240px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .product-description {
      color: #777;
      font-size: 14px;
      min-height: 40px;
      line-height: 1.5;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .price {
      color: #dc2626;
      font-size: 18px;
      font-weight: 800;
    }

    .add-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #111827;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #facc15;
      color: #111827;
    }

    /* CART */
    .cart-box {
      position: fixed;
      right: -430px;
      top: 0;
      width: 400px;
      max-width: 95%;
      height: 100vh;
      background: white;
      z-index: 200;
      box-shadow: -5px 0 25px rgba(0,0,0,0.2);
      transition: 0.3s;
      padding: 20px;
      overflow-y: auto;
    }

    .cart-box.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cart-header h2 {
      font-size: 22px;
    }

    .close-cart {
      border: none;
      background: #eee;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #dc2626;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      border: none;
      background: #eee;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-total {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      border: none;
      background: #16a34a;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    /* FORM */
    .form-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #f9fafb;
      border-radius: 15px;
    }

    .form-box.active {
      display: block;
    }

    .form-box h3 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 150;
    }

    .overlay.active {
      display: block;
    }

    /* FOOTER */
    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .logo {
        font-size: 20px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 190px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 16px;
      }

      .product-description {
        font-size: 13px;
      }

      .price {
        font-size: 15px;
      }

      .add-btn {
        width: 36px;
        height: 36px;
        font-size: 22px;
      }

      .cart-box {
        width: 95%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <div class="logo">
        CHI <span>SHOP</span>
      </div>

      <button class="cart-button" onclick="openCart()">
        🛒 Giỏ hàng
        (<span id="cartCount">0</span>)
      </button>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">
    <h1>🛍️ Chào mừng đến với Chi Shop</h1>
    <p>Chọn món bạn thích và đặt hàng online thật nhanh chóng.</p>
  </section>


  <!-- PRODUCTS -->
  <main class="container">

    <h2 class="section-title">
      🔥 Sản phẩm của chúng tôi
    </h2>

    <div class="products" id="products"></div>

  </main>


  <!-- OVERLAY -->
  <div
    class="overlay"
    id="overlay"
    onclick="closeCart()">
  </div>


  <!-- CART -->
  <aside class="cart-box" id="cartBox">

    <div class="cart-header">

      <h2>🛒 Giỏ hàng</h2>

      <button
        class="close-cart"
        onclick="closeCart()">
        ✕
      </button>

    </div>


    <div id="cartItems"></div>


    <div
      class="cart-total"
      id="cartTotal">
      <span>Tổng:</span>
      <span>0đ</span>
    </div>


    <button
      class="checkout-btn"
      onclick="showOrderForm()">
      📦 Đặt hàng
    </button>


    <!-- ORDER FORM -->
    <div
      class="form-box"
      id="orderForm">

      <h3>📋 Thông tin nhận hàng</h3>

      <div class="form-group">

        <label>Họ và tên *</label>

        <input
          type="text"
          id="customerName"
          placeholder="Nhập họ tên">

      </div>


      <div class="form-group">

        <label>Số điện thoại *</label>

        <input
          type="tel"
          id="customerPhone"
          placeholder="Nhập số điện thoại">

      </div>


      <div class="form-group">

        <label>Địa chỉ *</label>

        <textarea
          id="customerAddress"
          placeholder="Nhập địa chỉ nhận hàng"></textarea>

      </div>


      <div class="form-group">

        <label>Ghi chú</label>

        <textarea
          id="customerNote"
          placeholder="Ghi chú cho đơn hàng"></textarea>

      </div>


      <button
        class="submit-btn"
        onclick="submitOrder()">

        ✅ XÁC NHẬN ĐẶT HÀNG

      </button>

    </div>

  </aside>


  <!-- FOOTER -->
  <footer>

    <p>© 2026 Chi Shop</p>
    <p style="margin-top:7px;">
      Cảm ơn bạn đã mua hàng ❤️
    </p>

  </footer>


  <script>

    /* =========================
       GOOGLE SHEETS
    ========================= */

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzjBUCXPshHzCEDuWrf2Zhi5mbL3JOcIcNDmsIY_LFe_mL3NSf8Wojg7MQckGhfvOrt/exec";


    /* =========================
       SẢN PHẨM
    ========================= */

    const products = [

      {
        id: 1,
        name: "ChiChuChe",
        price: 7000,
        image:
          "1788673307306_699809316174268462_6915972963407532642_dd124868d3a12300a51a85d9d97adf5d.jpg",
        description:
          "Món ăn vui vẻ đặc biệt của ChiChuChe"
      },

      {
        id: 2,
        name: "Chi Dồ",
        price: 11000,
        image:
          "1788673307357_699809316174268462_6915972963407532642_a9056c57b106da7e6b1d9c5336506643.jpg",
        description:
          "Ngọt ngào, vui vẻ và siêu đáng yêu"
      },

      {
        id: 3,
        name: "Chi Điên",
        price: 70000,
        image:
          "1788673307382_699809316174268462_6915972963407532642_ef1e3a73f1951e24cc4cd6554d5131fb.jpg",
        description:
          "Ăn một lần là nhớ mãi không quên"
      },

      {
        id: 4,
        name: "Chi Hâm",
        price: 25000,
        image:
          "1788673307404_699809316174268462_6915972963407532642_0311ff7072b15e5ad33cd8b6b48b9f9e.jpg",
        description:
          "Một chút hâm hâm cho ngày thêm vui"
      }

    ];


    /* =========================
       GIỎ HÀNG
    ========================= */

    let cart = [];


    /* =========================
       HIỂN THỊ SẢN PHẨM
    ========================= */

    function renderProducts() {

      const productContainer =
        document.getElementById("products");

      productContainer.innerHTML = "";


      products.forEach(product => {

        productContainer.innerHTML += `

          <div class="product-card">

            <div class="product-image">

              <img
                src="${product.image}"
                alt="${product.name}"
              >

            </div>


            <div class="product-info">

              <div class="product-name">
                ${product.name}
              </div>


              <div class="product-description">
                ${product.description}
              </div>


              <div class="product-bottom">

                <div class="price">
                  ${formatMoney(product.price)}
                </div>


                <button
                  class="add-btn"
                  onclick="addToCart(${product.id})">

                  +

                </button>

              </div>

            </div>

          </div>

        `;

      });

    }


    /* =========================
       ĐỊNH DẠNG TIỀN
    ========================= */

    function formatMoney(number) {

      return number.toLocaleString("vi-VN") + "đ";

    }


    /* =========================
       THÊM GIỎ HÀNG
    ========================= */

    function addToCart(productId) {

      const product =
        products.find(p => p.id === productId);


      const existing =
        cart.find(item => item.id === productId);


      if (existing) {

        existing.quantity++;

      } else {

        cart.push({

          ...product,
          quantity: 1

        });

      }


      renderCart();

      openCart();

    }


    /* =========================
       TĂNG SỐ LƯỢNG
    ========================= */

    function increaseQuantity(productId) {

      const item =
        cart.find(item => item.id === productId);

      if (item) {

        item.quantity++;

      }

      renderCart();

    }


    /* =========================
       GIẢM SỐ LƯỢNG
    ========================= */

    function decreaseQuantity(productId) {

      const item =
        cart.find(item => item.id === productId);


      if (!item) return;


      item.quantity--;


      if (item.quantity <= 0) {

        cart =
          cart.filter(item => item.id !== productId);

      }


      renderCart();

    }


    /* =========================
       HIỂN THỊ GIỎ HÀNG
    ========================= */

    function renderCart() {

      const cartItems =
        document.getElementById("cartItems");


      const cartCount =
        document.getElementById("cartCount");


      const cartTotal =
        document.getElementById("cartTotal");


      if (cart.length === 0) {

        cartItems.innerHTML = `

          <div class="empty-cart">

            🛒<br><br>
            Giỏ hàng đang trống

          </div>

        `;

        cartTotal.innerHTML = `
          <span>Tổng:</span>
          <span>0đ</span>
        `;

        cartCount.textContent = "0";

        return;

      }


      let total = 0;
      let count = 0;


      cartItems.innerHTML = "";


      cart.forEach(item => {

        const itemTotal =
          item.price * item.quantity;


        total += itemTotal;

        count += item.quantity;


        cartItems.innerHTML += `

          <div class="cart-item">

            <img
              src="${item.image}"
              alt="${item.name}"
            >


            <div class="cart-item-info">

              <div class="cart-item-name">
                ${item.name}
              </div>


              <div class="cart-item-price">
                ${formatMoney(itemTotal)}
              </div>


              <div class="quantity">

                <button
                  onclick="decreaseQuantity(${item.id})">
                  −
                </button>


                <span>
                  ${item.quantity}
                </span>


                <button
                  onclick="increaseQuantity(${item.id})">
                  +
                </button>

              </div>

            </div>

          </div>

        `;

      });


      cartCount.textContent = count;


      cartTotal.innerHTML = `

        <span>Tổng:</span>

        <span>
          ${formatMoney(total)}
        </span>

      `;

    }


    /* =========================
       MỞ GIỎ HÀNG
    ========================= */

    function openCart() {

      document
        .getElementById("cartBox")
        .classList.add("active");


      document
        .getElementById("overlay")
        .classList.add("active");

    }


    /* =========================
       ĐÓNG GIỎ HÀNG
    ========================= */

    function closeCart() {

      document
        .getElementById("cartBox")
        .classList.remove("active");


      document
        .getElementById("overlay")
        .classList.remove("active");

    }


    /* =========================
       HIỆN FORM ĐẶT HÀNG
    ========================= */

    function showOrderForm() {

      if (cart.length === 0) {

        alert("🛒 Bạn chưa chọn sản phẩm!");

        return;

      }


      document
        .getElementById("orderForm")
        .classList.add("active");

    }


    /* =========================
       GỬI ĐƠN HÀNG
    ========================= */

    async function submitOrder() {

      const name =
        document
          .getElementById("customerName")
          .value
          .trim();


      const phone =
        document
          .getElementById("customerPhone")
          .value
          .trim();


      const address =
        document
          .getElementById("customerAddress")
          .value
          .trim();


      const note =
        document
          .getElementById("customerNote")
          .value
          .trim();


      if (!name || !phone || !address) {

        alert(
          "⚠️ Vui lòng nhập đầy đủ họ tên, số điện thoại và địa chỉ!"
        );

        return;

      }


      /* Tạo mã đơn */

      const orderCode =
        "DH" +
        Date.now();


      /* Danh sách sản phẩm */

      const items =
        cart
          .map(item =>
            `${item.name} x${item.quantity}`
          )
          .join(", ");


      /* Tổng số lượng */

      const quantity =
        cart.reduce(
          (sum, item) =>
            sum + item.quantity,
          0
        );


      /* Thời gian */

      const createdAt =
        new Date().toLocaleString("vi-VN");


      const orderData = {

        code: orderCode,

        name: name,

        phone: phone,

        address: address,

        note: note,

        items: items,

        quantity: quantity,

        createdAt: createdAt

      };


      try {

        await fetch(

          GOOGLE_SCRIPT_URL,

          {

            method: "POST",

            mode: "no-cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(orderData)

          }

        );


        alert(
          "🎉 Đặt hàng thành công!\n\nMã đơn: " +
          orderCode
        );


        /* Xóa giỏ hàng */

        cart = [];


        renderCart();


        /* Xóa form */

        document
          .getElementById("customerName")
          .value = "";


        document
          .getElementById("customerPhone")
          .value = "";


        document
          .getElementById("customerAddress")
          .value = "";


        document
          .getElementById("customerNote")
          .value = "";


        document
          .getElementById("orderForm")
          .classList.remove("active");


        closeCart();


      } catch (error) {

        console.error(error);

        alert(
          "❌ Có lỗi xảy ra. Vui lòng thử lại!"
        );

      }

    }


    /* =========================
       KHỞI ĐỘNG WEBSITE
    ========================= */

    renderProducts();

    renderCart();

  </script>

</body>
</html>
