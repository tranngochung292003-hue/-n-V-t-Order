function getLocation(){

    if(!navigator.geolocation){

        alert(
            "❌ Thiết bị không hỗ trợ định vị."
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position){


            document.getElementById("latitude").value =
            position.coords.latitude.toFixed(7);


            document.getElementById("longitude").value =
            position.coords.longitude.toFixed(7);


            alert(
                "✅ Đã lấy vị trí thành công!"
            );


        },


        function(){

            alert(
                "❌ Vui lòng cho phép truy cập vị trí."
            );

        },


        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}

  /* ==================================================
   CONFIRM ORDER - TIẾP
================================================== */

async function confirmOrder(){

const button=document.getElementById("confirmOrderButton");

if(!button || button.disabled) return;


const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();
const note=document.getElementById("customerNote").value.trim();

const latitude=document.getElementById("latitude").value.trim();
const longitude=document.getElementById("longitude").value.trim();


if(!latitude || !longitude){

alert("📍 Vui lòng gửi vị trí trước khi đặt hàng.");
return;

}


if(!name){

alert("Vui lòng nhập họ tên.");
return;

}


if(!/^0\d{9}$/.test(phone)){

alert("❌ Số điện thoại không hợp lệ.");
return;

}


if(!address){

alert("Vui lòng nhập địa chỉ.");
return;

}


if(cart.length===0){

alert("🛒 Giỏ hàng trống.");
return;

}


const finalData=calculateTotal();


button.disabled=true;
button.style.opacity=".6";
button.innerHTML="⏳ Đang gửi đơn...";


const orderCode=
"AVLT"+Date.now().toString().slice(-8);



const items=
cart.map(item=>{

const p=products.find(
x=>x.id===item.id
);

return p?
p.name+" x"+item.quantity
:"";

})
.filter(Boolean)
.join(", ");



const payload={

action:"order",

code:orderCode,

name:name,

phone:phone,

address:address,

latitude:latitude,

longitude:longitude,

note:note,

items:items,

subtotal:finalData.subtotal,

discount:finalData.discount,

total:finalData.total,

voucher:
appliedVoucher?
appliedVoucher.code:
"",

createdAt:
new Date().toLocaleString("vi-VN")

};



try{


await fetch(
GOOGLE_SCRIPT_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(payload)

}
);



cart=[];

appliedVoucher=null;

discountAmount=0;

saveData();

updateCart();


closeOrderForm();


alert(
"✅ Đặt hàng thành công!\n\n"+
"Mã đơn: "+
orderCode+
"\n\nTổng tiền: "+
money(finalData.total)
);



openPaymentQR();


setTimeout(()=>{

location.reload();

},1500);



}catch(error){


alert(
"❌ Gửi đơn thất bại. Vui lòng thử lại."
);


console.error(error);


}



button.disabled=false;
button.style.opacity="1";
button.innerHTML="✅ Xác nhận đặt hàng";


}

/* ==============================
   RESET SAU KHI ĐẶT HÀNG

function resetOrderForm(){

    const fields = [
        "customerName",
        "customerPhone",
        "customerAddress",
        "customerNote",
        "latitude",
        "longitude"
    ];

    fields.forEach(id=>{

        const el=document.getElementById(id);

        if(el){
            el.value="";
        }

    });

}


/* ==============================
   CLICK NGOÀI MODAL ĐỂ ĐÓNG
============================== */

window.onclick=function(event){

    const cartModal =
        document.getElementById("cartModal");

    const orderModal =
        document.getElementById("orderModal");

    const paymentQR =
        document.getElementById("paymentQR");


    if(event.target===cartModal){

        closeCart();

    }


    if(event.target===orderModal){

        closeOrderForm();

    }


    if(event.target===paymentQR){

        closePaymentQR();

    }

}

});


/* ==============================
   ENTER TÌM KIẾM
============================== */

const searchInput =
document.getElementById(
    "productSearch"
);

if(searchInput){

    searchInput.addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){

                searchProducts(
                    this.value
                );

            }

        }
    );

}


/* ==============================
   PRELOAD ẢNH
============================== */

function preloadImages(){

    products.forEach(product=>{

        if(product.image){

            const img =
            new Image();

            img.src =
            product.image;

        }

    });

}


/* ==============================
   CẬP NHẬT SAU KHI LOAD
============================== */

const oldRenderProducts =
renderProducts;


renderProducts=function(){

    oldRenderProducts();

    preloadImages();

};


/* ==============================
   WELCOME DELAY
============================== */

setTimeout(()=>{

    openWelcomePopup();

},800);



/* ==============================
   CHỐNG DOUBLE CLICK NÚT
============================== */

document.addEventListener(
"click",
function(e){

    const btn =
    e.target.closest("button");


    if(!btn) return;


    if(
        btn.classList.contains("add-btn")
    ){

        btn.disabled=true;


        setTimeout(()=>{

            btn.disabled=false;

        },300);

    }

});



/* ==============================
   FORMAT TIỀN INPUT
============================== */

function onlyNumber(input){

    input.value =
    input.value.replace(
        /[^0-9]/g,
        ""
    );

}



</script>

</body>
</html>
