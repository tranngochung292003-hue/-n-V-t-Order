<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiệm Ăn Vặt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7f0;
      color: #333;
    }

    header {
      background: #ff6b35;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      margin-bottom: 6px;
    }

    .price {
      color: #ff5722;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: #ff6b35;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    button:hover {
      background: #e85b2d;
    }

    .cart {
      background: white;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      text-align: right;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 10px;
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: 1fr 1fr;
      }

      .product img {
        height: 120px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍟 TIỆM ĂN VẶT</h1>
  <p>Ngon - Rẻ - Giao tận nơi</p>
</header>

<div class="container">

  <h2>🍴 Menu</h2>

  <div class="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>ChiChuChe</h3>
        <div class="price">25.000đ</div>
        <button onclick="addToCart('Khoai tây chiên', 25000)">
          Thêm vào giỏ
        </button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Chi Dồ</h3>
        <div class="price">30.000đ</div>
        <button onclick="addToCart('Gà viên', 30000)">
          Thêm vào giỏ
        </button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1612392062631-94dd858cba88?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Chi Điên</h3>
        <div class="price">15.000đ</div>
        <button onclick="addToCart('Xúc xích', 15000)">
          Thêm vào giỏ
        </button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=600&q=80">
      <div class="product-info">
        <h3>Chi Hâm</h3>
        <div class="price">20.000đ</div>
        <button onclick="addToCart('Bánh ngọt', 20000)">
          Thêm vào giỏ
        </button>
      </div>
    </div>

  </div>

  <div class="cart">
    <h2>🛒 Giỏ hàng</h2>

    <div id="cartItems">
      <div class="empty">Chưa có món nào</div>
    </div>

    <div class="total">
      Tổng: <span id="total">0</span>đ
    </div>

    <button onclick="order()">

  Đặt hàng

</button>

<div id="orderForm" style="display:none; margin-top:20px;">

  <h3>📦 Thông tin đặt hàng</h3>

  <input id="customerName" type="text" placeholder="Họ và tên"

    style="width:100%; padding:12px; margin:8px 0;">

  <input id="customerPhone" type="tel" placeholder="Số điện thoại"

    style="width:100%; padding:12px; margin:8px 0;">

  <textarea id="customerAddress" placeholder="Địa chỉ nhận hàng"

    style="width:100%; padding:12px; margin:8px 0; height:80px;"></textarea>

  <textarea id="customerNote" placeholder="Ghi chú"

    style="width:100%; padding:12px; margin:8px 0; height:60px;"></textarea>

  <button onclick="confirmOrder()">

    Xác nhận đặt hàng

  </button>

</div>
    </button>
  </div>

</div>

<script>

  let cart = [];

  function addToCart(name, price) {

    let item = cart.find(product => product.name === name);

    if (item) {
      item.quantity++;
    } else {
      cart.push({
        name: name,
        price: price,
        quantity: 1
      });
    }

    updateCart();
  }

  function updateCart() {

    const cartItems = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");

    cartItems.innerHTML = "";

    if (cart.length === 0) {
      cartItems.innerHTML =
        '<div class="empty">Chưa có món nào</div>';

      totalElement.innerText = "0";
      return;
    }

    let total = 0;

    cart.forEach((item, index) => {

      let itemTotal = item.price * item.quantity;

      total += itemTotal;

      cartItems.innerHTML += `
        <div class="cart-item">
          <div>
            ${item.name}
            × ${item.quantity}
          </div>

          <div>
            ${itemTotal.toLocaleString('vi-VN')}đ
          </div>
        </div>
      `;
    });

    totalElement.innerText =
      total.toLocaleString('vi-VN');
  }

  function order() {

  if (cart.length === 0) {

    alert("Bạn chưa chọn món!");

    return;

  }

  document.getElementById("orderForm").style.display = "block";

}
